<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <!-- Illuminated border for the book skin, built as a 3x3 border-image tile:
       120px corners, a repeating 120px edge unit between them, and an empty
       middle the page shows through. Everything is composed from four
       primitives so the whole border is one small file.

       The palette is a manuscript's: lapis blue, coral, leaf green, and
       burnished gold bosses. -->
  <defs>
    <!-- A lobed acanthus leaf, base at the origin, growing to the right. -->
    <path id="leaf"
      d="M0,0 C4,-11 15,-19 27,-19 C23,-13 27,-9 33,-11 C29,-4 32,2 38,3
         C28,11 13,12 4,5 C6,2 4,-1 0,0 Z" />
    <!-- A gold boss: the burnished stud that pins a vine to the page. -->
    <g id="boss">
      <circle r="6.5" fill="#c9a227" />
      <circle r="6.5" fill="none" stroke="#8a6a18" stroke-width="1.2" />
      <circle cx="-2" cy="-2.2" r="2" fill="#f0dc95" />
    </g>

    <!-- One corner: a stem sweeping out of the angle, a tight inner curl,
         leaves alternating coral and blue, and two bosses. -->
    <g id="corner-unit">
      <path d="M9,113 C9,63 18,27 47,11 C69,-1 96,3 115,9"
        fill="none" stroke="#5f7f3f" stroke-width="2.6" stroke-linecap="round" />
      <path d="M17,95 C35,91 45,73 37,59 C31,48 13,49 13,61 C13,71 25,73 29,65"
        fill="none" stroke="#5f7f3f" stroke-width="1.9" stroke-linecap="round" />
      <path d="M60,14 C74,26 92,24 104,14"
        fill="none" stroke="#5f7f3f" stroke-width="1.6" stroke-linecap="round" />
      <use href="#leaf" transform="translate(31,21) rotate(22) scale(1.15)"
        fill="#6f93c6" stroke="#3f639a" stroke-width="1.2" />
      <use href="#leaf" transform="translate(66,7) rotate(-6) scale(1.05)"
        fill="#d98070" stroke="#ad5847" stroke-width="1.2" />
      <use href="#leaf" transform="translate(11,64) rotate(97) scale(0.95)"
        fill="#7fa356" stroke="#4d7132" stroke-width="1.2" />
      <use href="#leaf" transform="translate(7,101) rotate(122) scale(0.9)"
        fill="#d98070" stroke="#ad5847" stroke-width="1.2" />
      <use href="#leaf" transform="translate(101,11) rotate(34) scale(0.8)"
        fill="#6f93c6" stroke="#3f639a" stroke-width="1.2" />
      <use href="#boss" transform="translate(45,35)" />
      <use href="#boss" transform="translate(15,86) scale(0.8)" />
    </g>

    <!-- One edge: a waving stem with a leaf either side of a boss. Tiled
         (border-image-repeat: round) along the top, bottom and sides. -->
    <g id="edge-unit">
      <path d="M0,17 C22,3 44,33 68,19 C92,5 106,21 120,13"
        fill="none" stroke="#5f7f3f" stroke-width="2.4" stroke-linecap="round" />
      <use href="#leaf" transform="translate(26,19) rotate(152) scale(0.82)"
        fill="#d98070" stroke="#ad5847" stroke-width="1.3" />
      <use href="#leaf" transform="translate(74,17) rotate(-22) scale(0.82)"
        fill="#6f93c6" stroke="#3f639a" stroke-width="1.3" />
      <use href="#boss" transform="translate(50,25) scale(0.72)" />
    </g>
  </defs>

  <use href="#corner-unit" />
  <use href="#corner-unit" transform="translate(360,0) scale(-1,1)" />
  <use href="#corner-unit" transform="translate(0,360) scale(1,-1)" />
  <use href="#corner-unit" transform="translate(360,360) scale(-1,-1)" />

  <use href="#edge-unit" transform="translate(120,0)" />
  <use href="#edge-unit" transform="translate(120,360) scale(1,-1)" />
  <use href="#edge-unit" transform="translate(0,240) rotate(-90)" />
  <use href="#edge-unit" transform="translate(360,120) rotate(90)" />
</svg>
