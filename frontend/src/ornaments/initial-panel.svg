<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The ground an illuminated initial is set on: a coral frame, a burnished
       gold fillet, and a lapis field carrying white filigree and gold buds.
       The letter itself is TEXT, set over this — so the initial is whatever
       the analysis is called, and the panel never has to know. -->
