<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 140" width="44" height="140">
  <!-- The vine that runs down the gutter of the book skin, between the tree
       page and the text page — the knotted stem a manuscript sets between two
       columns. Tiled vertically, so the stem must leave and enter the tile at
       the same x (22). -->
  <defs>
    <path id="vine-leaf"
      d="M0,0 C4,-10 14,-17 24,-17 C21,-12 24,-8 29,-10 C25,-4 28,1 34,2
         C25,10 11,10 3,4 C5,2 3,-1 0,0 Z" />
  </defs>

  <g fill="none" stroke="#5f7f3f" stroke-width="2.6" stroke-linecap="round">
    <path d="M22,0 C26,14 17,24 17,36 C17,45 24,49 22,56" />
    <path d="M22,84 C19,92 27,97 27,108 C27,120 18,128 22,140" />
    <!-- the knot: an outer loop with a braid crossing it -->
    <path d="M22,56 C7,60 7,80 22,84 C37,80 37,60 22,56 Z" />
    <path d="M22,60 C33,66 33,75 22,79" stroke-width="2" />
    <path d="M22,79 C11,75 11,66 22,60" stroke-width="2" stroke-dasharray="9 7" />
  </g>

  <use href="#vine-leaf" transform="translate(17,26) rotate(196) scale(0.72)"
    fill="#d98070" stroke="#ad5847" stroke-width="1.3" />
  <use href="#vine-leaf" transform="translate(27,106) rotate(-16) scale(0.72)"
    fill="#6f93c6" stroke="#3f639a" stroke-width="1.3" />

  <g transform="translate(22,70)">
    <circle r="5" fill="#c9a227" />
    <circle r="5" fill="none" stroke="#8a6a18" stroke-width="1.1" />
    <circle cx="-1.5" cy="-1.7" r="1.6" fill="#f0dc95" />
  </g>
</svg>
