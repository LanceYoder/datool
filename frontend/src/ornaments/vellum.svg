<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- The grain of the page: fractal noise, desaturated, laid faintly over the
       parchment so the vellum is not a flat wash of color. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="11" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="240" height="240" filter="url(#grain)" opacity="0.14" />
</svg>
