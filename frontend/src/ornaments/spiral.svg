<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 34" width="22" height="34">
  <!-- One loop of the wire binding, tiled down the fold. The loop is slanted,
       the way twin-wire always is, and lit from the upper left: bright along
       the top of the wire, dark underneath, so it reads as round metal rather
       than a drawn ring.

       It is 22px wide and sits just off centre, because the only clear lane
       at the fold is between the last proposition dot (which ends 12px left
       of the text) and the verse numbers (which are right-aligned, and so
       start some 40px into their column). A wider ring would be threaded
       through the dots. -->
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#fdfdfd" />
      <stop offset="34%" stop-color="#c8ccd2" />
      <stop offset="72%" stop-color="#8d949d" />
      <stop offset="100%" stop-color="#6c737c" />
    </linearGradient>
  </defs>

  <g transform="translate(11 17) rotate(-24)">
    <ellipse rx="8.4" ry="5" fill="none" stroke="#5f666e" stroke-width="3.4" opacity="0.4" />
    <ellipse rx="8.4" ry="5" fill="none" stroke="url(#wire)" stroke-width="2.5" />
    <path d="M-8.4,0 A8.4,5 0 0 1 0,-5" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.75" />
  </g>
</svg>
